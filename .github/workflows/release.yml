name: Release

# Сборка и публикация ZapretManager.exe.
#
# Зачем это в CI, а не на локальной машине:
#   * exe собирается из публичного репозитория на чистом раннере — это видимая
#     provenance, её учитывают и SmartScreen, и аналитики ложных срабатываний;
#   * один и тот же билд проходит через подпись SignPath (если настроена) —
#     подпись привязана к репозиторию, а не к ноутбуку автора;
#   * checksums.txt считается уже ПОСЛЕ подписи, поэтому self-update в
#     приложении сверяет хэш именно того файла, который лежит в релизе.
#
# Что нужно один раз настроить в Settings → Secrets and variables → Actions:
#   secrets.SIGNPATH_API_TOKEN                  — токен SignPath (Actions → API token)
#   vars.SIGNPATH_ORGANIZATION_ID               — id организации SignPath
#   vars.SIGNPATH_PROJECT_SLUG                  — слаг проекта (например zapret-manager)
#   vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG   — конфигурация артефакта (например initial)
#   vars.SIGNPATH_SIGNING_POLICY                — release-signing
# Без этих значений workflow всё равно собирает и публикует неподписанный exe.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например v2.9.2). Пусто — только собрать artifact, без публикации."
        required: false
        default: ""
      publish:
        description: "Опубликовать GitHub Release"
        type: boolean
        default: false
      sign:
        description: "Подписать через SignPath (если настроены secrets/vars)"
        type: boolean
        default: true

permissions:
  contents: write
  # SignPath скачивает загруженный artifact по API — нужен доступ к Actions.
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Статический CRT: exe не требует установленного VC++ Redistributable.
  RUSTFLAGS: "-C target-feature=+crt-static"
  SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
  SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
  SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
  SIGNPATH_SIGNING_POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY }}

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      SIGNING_AVAILABLE: ${{ vars.SIGNPATH_PROJECT_SLUG != '' && secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test --locked

      - name: Tag must match Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' |
                  Select-Object -First 1).Matches[0].Groups[1].Value
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          Write-Host "Cargo.toml: $ver, tag: $tag"
          if ($ver -ne $tag) {
            throw "Версия в Cargo.toml ($ver) не совпадает с тегом ($tag). Self-update сравнивает тег релиза с версией exe."
          }

      - name: Build
        run: cargo build --release --locked

      - name: Verify executable metadata
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/verify-exe.ps1 target/release/ZapretManager.exe

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/ZapretManager.exe dist/ZapretManager.exe -Force

      - name: Upload unsigned artifact
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: ZapretManager-unsigned
          path: dist/ZapretManager.exe
          if-no-files-found: error

      - name: Sign with SignPath
        id: signpath
        if: ${{ env.SIGNING_AVAILABLE == 'true' && inputs.sign != false }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY }}
          artifact-configuration-slug: ${{ env.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use signed executable
        if: ${{ steps.signpath.outcome == 'success' }}
        shell: pwsh
        run: |
          if (-not (Test-Path signed/ZapretManager.exe)) { throw "SignPath не вернул подписанный файл" }
          Copy-Item signed/ZapretManager.exe dist/ZapretManager.exe -Force

      - name: Verify final executable
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools/verify-exe.ps1 dist/ZapretManager.exe

      # Хэш считается после подписи: подпись меняет байты файла.
      - name: Checksums
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/ZapretManager.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ZapretManager.exe`r`n" | Set-Content dist/checksums.txt -Encoding ASCII -NoNewline
          Get-Content dist/checksums.txt

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZapretManager
          path: |
            dist/ZapretManager.exe
            dist/checksums.txt
          if-no-files-found: error

      - name: Resolve release tag
        id: tag
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME } else { $env:INPUT_TAG }
          "tag=$($tag.Trim())" >> $env:GITHUB_OUTPUT

      - name: Warn about unsigned release
        if: ${{ steps.tag.outputs.tag != '' && env.SIGNING_AVAILABLE != 'true' }}
        shell: pwsh
        run: |
          Write-Host "::warning title=Неподписанный релиз::SignPath не настроен (или отключён) — exe уйдёт без подписи. SmartScreen и Defender будут относиться к нему хуже."

      - name: Publish release
        if: ${{ steps.tag.outputs.tag != '' && (startsWith(github.ref, 'refs/tags/v') || inputs.publish) }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Zapret Manager ${{ steps.tag.outputs.tag }}"
          draft: false
          prerelease: false
          body: |
            **Контрольная сумма** — в `checksums.txt` рядом с `ZapretManager.exe`.

            Проверка после скачивания:

            ```powershell
            Get-FileHash .\ZapretManager.exe -Algorithm SHA256
            ```

            Если Windows или антивирус жалуются на файл — см. [SECURITY.md](https://github.com/RoBiN19666/ZapretManager-Desktop/blob/main/SECURITY.md).
          files: |
            dist/ZapretManager.exe
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
